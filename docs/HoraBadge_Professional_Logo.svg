<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 300 300">
  <!-- Background -->
  <rect width="300" height="300" fill="#1E88E5" rx="20" />

  <!-- Clock Icon -->
  <circle cx="150" cy="120" r="80" fill="#FFFFFF" />
  <line x1="150" y1="120" x2="150" y2="70" stroke="#1E88E5" stroke-width="10" stroke-linecap="round" />
  <line x1="150" y1="120" x2="200" y2="120" stroke="#1E88E5" stroke-width="10" stroke-linecap="round" />

  <!-- Badge Icon -->
  <rect x="110" y="180" width="80" height="60" fill="#FFFFFF" rx="10" />
  <circle cx="150" cy="210" r="15" fill="#1E88E5" />

  <!-- Text -->
  <text x="150" y="280" font-family="'Arial Black', sans-serif" font-size="30" fill="#FFFFFF" text-anchor="middle">HoraBadge</text>
</svg>